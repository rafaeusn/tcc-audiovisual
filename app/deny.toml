# cargo deny check: licenças compatíveis com a GPL-3, nada de fonte desconhecida.
# Uso (dentro de app/): cargo deny check licenses sources

[graph]
all-features = false

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "0BSD",
    "NCSA",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "LGPL-2.1-or-later",
    "GPL-3.0-or-later",
    "GPL-3.0-only",
]
# O rustypipe (provedor do YouTube Music) declara "GPL-3.0", o nome antigo de "GPL-3.0-only".
exceptions = [{ allow = ["GPL-3.0"], crate = "rustypipe" }]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "warn"
