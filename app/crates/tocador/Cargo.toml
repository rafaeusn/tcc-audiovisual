[package]
name = "tocador"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Toca música de arquivos e de endereços na internet: decodifica (MP3, FLAC, WAV, OGG, M4A), ajusta a taxa e entrega para a saída de som."

[dependencies]
nucleo.workspace = true
audio.workspace = true
log.workspace = true
cpal.workspace = true
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "pcm", "ogg", "vorbis", "aac", "isomp4"] }
rubato = "0.16"
rtrb = "0.3"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"

[lints]
workspace = true
