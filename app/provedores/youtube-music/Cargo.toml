[package]
name = "provedor-youtube-music"
edition.workspace = true
version.workspace = true
# O rustypipe é GPL-3.0 (só a 3): este programa, que o usa, fica sob a GPL-3.0.
license = "GPL-3.0-only"
rust-version.workspace = true
description = "Provedor do YouTube Music para o Player (F3): busca, início, álbuns, artistas, playlists e o endereço do áudio, pelo protocolo de provedores."

[[bin]]
name = "provedor-youtube-music"
path = "src/main.rs"

[dependencies]
provedores.workspace = true
nucleo.workspace = true
rustypipe = { version = "0.11", default-features = false, features = ["native-tls"] }
tokio = { version = "1", features = ["rt", "macros", "time"] }
# O mesmo reqwest do rustypipe (sem dependência nova): os pedidos da rota direta (visionOS).
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
serde_json = "1"

[lints]
workspace = true
