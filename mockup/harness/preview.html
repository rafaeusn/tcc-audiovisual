<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Doto:wght@500..800&family=Fragment+Mono&display=swap">

<body>
<div id="host"></div>
<script>
// Interpretador mínimo do formato .dc.html, só para conferência visual local.
if (/[?&]raf=timeout/.test(location.search)) window.requestAnimationFrame = function (f) { return setTimeout(function () { f(performance.now()); }, 16); };
class DCLogic {
  constructor(p) { this.props = p || {}; this.state = {}; }
  setState(u) { const v = typeof u === 'function' ? u(this.state, this.props) : u; const prev = Object.assign({}, this.state); Object.assign(this.state, v); if (window.__sched) window.__sched(); if (this.componentDidUpdate) this.componentDidUpdate(this.props, prev); }
  forceUpdate() { if (window.__sched) window.__sched(); }
}
</script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const file = params.get('f') || 'Main.dc.html';
  const src = await (await fetch('../project/' + file, { cache: 'no-store' })).text();
  const doc = new DOMParser().parseFromString(src, 'text/html');
  const code = doc.querySelector('script[data-dc-script]').textContent;
  (0, eval)(code + '\nwindow.__Component = Component;');
  const xdc = doc.querySelector('x-dc');
  const tpl = Array.from(xdc.children).find((n) => n.tagName.toLowerCase() !== 'helmet');
  const props = {};
  params.forEach((v, k) => { if (['f', 'w', 'h', 'name', 'wait'].indexOf(k) < 0) props[k.replace(/-([a-z])/g, (m, c) => c.toUpperCase())] = v; });
  const C = window.__Component;
  if (C.COVERS) await Promise.all(Object.values(C.COVERS).map((u) => new Promise((ok) => { const im = new Image(); im.onload = im.onerror = ok; im.src = u; })));
  const comp = new C(props);
  window.__c = comp;
  const get = (scope, path) => path.trim().split('.').reduce((o, k) => (o == null ? undefined : o[k]), scope);
  const hole = /\{\{\s*([^}]+?)\s*\}\}/g;
  const evalStr = (scope, s) => s.replace(hole, (m, p) => { const v = lit(p) !== undefined ? lit(p) : get(scope, p); return v == null ? '' : String(v); });
  const lit = (p) => (p === 'true' ? true : p === 'false' ? false : /^-?\d+(\.\d+)?$/.test(p) ? +p : undefined);
  const whole = (s) => { const m = /^\{\{\s*([^}]+?)\s*\}\}$/.exec(s); return m ? m[1] : null; };
  const evMap = { onclick: 'click', onpointerdown: 'pointerdown', onpointermove: 'pointermove', onpointerleave: 'pointerleave', onkeydown: 'keydown', onmouseenter: 'mouseenter', ondoubleclick: 'dblclick', onchange: 'input' };
  function build(node, scope, out) {
    if (node.nodeType === 3) { out.appendChild(document.createTextNode(evalStr(scope, node.nodeValue))); return; }
    if (node.nodeType !== 1) return;
    const tag = node.tagName.toLowerCase();
    if (tag === 'sc-if') { const p = whole(node.getAttribute('value')); const v = lit(p) !== undefined ? lit(p) : get(scope, p); if (v) node.childNodes.forEach((c) => build(c, scope, out)); return; }
    if (tag === 'sc-for') { const list = get(scope, whole(node.getAttribute('list'))) || []; const as = node.getAttribute('as'); list.forEach((it, i) => { const sc = Object.create(scope); sc[as] = it; sc.$index = i; node.childNodes.forEach((c) => build(c, sc, out)); }); return; }
    const isSvg = node.namespaceURI === 'http://www.w3.org/2000/svg';
    const el = isSvg ? document.createElementNS('http://www.w3.org/2000/svg', node.tagName) : document.createElement(tag);
    for (const a of Array.from(node.attributes)) {
      const name = a.name, val = a.value, p = whole(val);
      const lname = name.toLowerCase();
      if (evMap[lname]) { const fn = p ? get(scope, p) : null; if (typeof fn === 'function') el.addEventListener(evMap[lname], fn); continue; }
      if (lname === 'ref') { const fn = p ? get(scope, p) : null; if (typeof fn === 'function') setTimeout(() => fn(el), 0); continue; }
      if (p) {
        const v = lit(p) !== undefined ? lit(p) : get(scope, p);
        if (lname === 'disabled') { if (v) el.setAttribute('disabled', ''); continue; }
        if (lname === 'value' && (tag === 'input')) { el.value = v == null ? '' : v; el.setAttribute('value', v == null ? '' : v); continue; }
        if (v === undefined || v === null) continue;
        el.setAttribute(name, String(v));
      } else el.setAttribute(name, evalStr(scope, val));
    }
    if (tag === 'img') { el.decoding = 'sync'; el.loading = 'eager'; }
    node.childNodes.forEach((c) => build(c, scope, el));
    out.appendChild(el);
  }
  const host = document.getElementById('host');
  let pending = false;
  const keep = {};
  function render() {
    pending = false;
    const vals = comp.renderVals();
    const frag = document.createElement('div');
    build(tpl, vals, frag);
    const fresh = frag.firstElementChild;
    const old = host.firstElementChild;
    if (old) {
      ['canvas.gl', 'canvas[data-map="bar"]', 'canvas[data-map="fs"]', 'canvas[data-map="mini"]'].forEach((sel) => { const o = old.querySelector(sel), n = fresh.querySelector(sel); if (o && n) n.replaceWith(o); });
      const ae = document.activeElement;
      host.replaceChild(fresh, old);
    } else host.appendChild(fresh);
  }
  let renders = 0;
  window.__sched = () => { if (renders > 5000) return; if (!pending) { pending = true; renders++; requestAnimationFrame(render); } };
  render();
  comp.componentDidMount();
  if (params.get('name')) {
    // captura: roda quadros manualmente e salva a página inteira via html2canvas não disponível -> só sinaliza pronto
  }
  document.title = 'READY';
})();
</script>
