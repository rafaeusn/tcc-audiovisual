[package]
name = "gpui-proto"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "Protótipo GPUI: dock do gpui-component, temas e o mesmo visual wgpu."

[dependencies]
proto-core.workspace = true
serde_json.workspace = true
gpui = "0.2.2"
wgpu.workspace = true
toml.workspace = true
image = { version = "0.25", default-features = false }
smallvec = "1"
pollster.workspace = true
raw-window-handle = "0.6"
kdl = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_DirectComposition", "Win32_Graphics_Dxgi"] }
